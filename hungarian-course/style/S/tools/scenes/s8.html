<!-- s8 · Apple-style self-check card -->
<style>
#s8-wrap{position:absolute;inset:0;}
#s8-bg{position:absolute;inset:0;}
#root .bk{position:absolute;filter:blur(26px);opacity:0.6;}
#s8-card{position:absolute;left:320px;top:150px;width:640px;height:420px;border-radius:34px;background:rgba(253,251,246,0.62);
  -webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 1px 2px rgba(60,40,20,0.06),0 22px 50px rgba(60,40,20,0.12);}
#s8-ask{position:absolute;left:0;top:70px;width:640px;text-align:center;font-size:32px;line-height:40px;}
#s8-qm{position:absolute;left:0;top:118px;width:640px;height:100px;overflow:hidden;}
#s8-q{position:absolute;left:0;top:0;width:640px;text-align:center;font-style:italic;font-weight:500;font-size:76px;line-height:96px;color:#211B16;}
#s8-ring{position:absolute;left:296px;top:262px;width:48px;height:48px;}
#s8-am{position:absolute;left:0;top:236px;width:640px;height:120px;overflow:hidden;}
#s8-a{position:absolute;left:0;top:0;width:640px;text-align:center;font-size:92px;line-height:114px;font-variation-settings:"wght" 700;color:#211B16;}
</style>
<div id="s8-wrap">
  <div id="s8-bg">
    <img class="paper" src="assets/img/paper.jpg" alt="" />
    <img class="bk" id="s8-k1" src="assets/img/house.png" alt="" style="left:-120px;top:240px;width:640px;height:auto" />
    <img class="bk" id="s8-k2" src="assets/img/window.png" alt="" style="left:860px;top:60px;width:420px;height:auto" />
    <img class="bk" id="s8-k3" src="assets/img/jug.png" alt="" style="left:980px;top:420px;width:220px;height:auto" />
  </div>
  <div class="hd" id="s8-hd">Проверьте себя</div>
  <div id="s8-card">
    <div class="ru" id="s8-ask">Как сказать по-венгерски</div>
    <div id="s8-qm" data-layout-allow-overflow><div id="s8-q">в Перми</div></div>
    <svg id="s8-ring" viewBox="0 0 48 48" data-layout-ignore><circle cx="24" cy="24" r="20" fill="none" stroke="#E2D8C6" stroke-width="3"/><circle id="s8-rc" cx="24" cy="24" r="20" fill="none" stroke="#3B6E9B" stroke-width="3" stroke-linecap="round" transform="rotate(-90 24 24)" stroke-dasharray="125.7" stroke-dashoffset="125.7"/></svg>
    <div id="s8-am" data-layout-allow-overflow><div class="hu" id="s8-a">Perm<span class="b">ben</span></div></div>
  </div>
</div>
<script>
const P = T.parts, qT = P[1].t, H = T.hu[0].t;
const tl = gsap.timeline({ paused: true });
// in: a zoom-blur arrival of the whole layer, then the card springs into place
tl.fromTo("#s8-wrap", { opacity: 0, scale: 1.06, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0);
tl.fromTo("#s8-card", { y: 60, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.0, ease: "elastic.out(1, 0.8)" }, 0.2);
tl.fromTo("#s8-hd", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.4);
tl.fromTo(["#s8-k1", "#s8-k2", "#s8-k3"], { x: 0, y: 0 }, { x: (i) => [18, -14, -10][i], y: (i) => [-8, 10, -12][i], duration: T.slot, ease: "none" }, 0);
tl.fromTo("#s8-ask", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.0);
// the question rises out of a mask when it is spoken
tl.fromTo("#s8-q", { y: 100, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, qT - 0.1);
// three seconds to think: a thin ring fills
tl.fromTo("#s8-ring", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, qT + 0.9);
tl.fromTo("#s8-rc", { strokeDashoffset: 125.7 }, { strokeDashoffset: 0, duration: H - (qT + 1.1) - 0.1, ease: "none" }, qT + 1.1);
tl.to("#s8-ring", { opacity: 0, scale: 0.5, duration: 0.25, ease: "power2.in" }, H - 0.25);
// answer: the question steps up, the answer is unmasked with a spring
tl.to("#s8-qm", { y: -36, duration: 0.6, ease: "power3.inOut" }, H - 0.2);
tl.to("#s8-ask", { opacity: 0, y: -16, duration: 0.4, ease: "power2.in" }, H - 0.2);
tl.fromTo("#s8-a", { y: 120, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.9, ease: "elastic.out(1, 0.7)" }, H - 0.05);
tl.set({}, {}, T.slot);
window.__timelines = window.__timelines || {};
window.__timelines["s8"] = tl;
</script>
