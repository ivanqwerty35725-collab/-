<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/jsm/"}}</script>
<link rel="stylesheet" href="fonts/serif.css">
<link rel="stylesheet" href="fonts/digital-fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#111}
body.cell{width:800px;height:533px;background:#efede8}
body.motion{width:1280px;height:720px}
#viewport{position:absolute;left:0;top:0;overflow:hidden}
body.cell #viewport{width:800px;height:477px}
body.motion #viewport{width:1280px;height:720px}
#stage{position:absolute;left:0;top:0;width:1280px;height:764px;overflow:hidden;transform-origin:0 0}
body.cell #stage{transform:scale(.625)}
body.motion #stage{top:-22px}
#stage > *{position:absolute}
#cap{position:absolute;left:0;top:477px;width:800px;height:56px;background:#efede8;border-top:1px solid #d6d2c9;
  display:flex;align-items:center;gap:14px;padding:0 26px;color:#1d1f1e;font-family:'Source Serif 4',serif;white-space:nowrap}
body.motion #cap{display:none}
#cap .n{font-weight:700;font-size:25px;color:#2D6A4F;min-width:16px}
#cap .t{font-style:italic;font-weight:400;font-size:24px;letter-spacing:.1px}
#cap .src{margin-left:auto;font-style:italic;font-size:12.5px;color:#6c6a64;line-height:1.25;text-align:right;white-space:normal;max-width:330px}
</style></head><body>
<div id="viewport"><div id="stage"></div></div>
<div id="cap"><span class="n"></span><span class="t"></span><span class="src"></span></div>
<script src="lib/gsap.min.js"></script>
<script src="common.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const n = +Q.get("n") || 1, mode = Q.get("mode") || "cell";
document.body.className = mode;
document.querySelector("#cap .n").textContent = n;
document.querySelector("#cap .t").textContent = U.CAPTIONS[n - 1];
function load(src){return new Promise((ok,err)=>{const s=document.createElement("script");s.src=src;if(src.endsWith('.mjs'))s.type='module';s.onload=ok;s.onerror=()=>err(new Error('load '+src));document.body.appendChild(s);});}
window.seek = async (t) => { await window.SCENE.seek(Math.max(t, 0.0005)); await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); };
(async()=>{
  try{
    await load("s"+n+(Q.get("v")||"")+".js");
    await document.fonts.ready;
    await Promise.all([...document.fonts].filter(f=>f.status!=='loaded').map(f=>f.load().catch(()=>0)));
    const st = document.getElementById("stage");
    await window.SCENE.build(st, mode);
    if (window.SCENE.src) document.querySelector("#cap .src").innerHTML = window.SCENE.src;
    window.READY = true;
  }catch(e){window.ERR = String(e && e.stack || e); window.READY = true;}
})();
</script>
</body></html>
